name: Release

# Publishes to npm (with provenance) and creates the GitHub Release when a tag vX.Y.Z is pushed.
# Nothing else triggers it. The owner decides when: see docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub Release
  id-token: write # npm provenance (and npm trusted publishing)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: node scripts/check-pack.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w demo && npx playwright test
      - name: Release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish to npm with provenance
        # Trusted publishing (OIDC) needs no token; NPM_TOKEN is only a fallback.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
